<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Tester</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3152;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; color: #a78bfa; }
    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ef4444; flex-shrink: 0;
    }
    #status-dot.connected { background: #22c55e; }
    #status-label { font-size: 13px; color: #94a3b8; }

    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 320px; min-width: 280px;
      background: #1a1d2e;
      border-right: 1px solid #2d3152;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section { padding: 16px; border-bottom: 1px solid #2d3152; }
    .sidebar-section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; margin-bottom: 10px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; margin-top: 8px; }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%; padding: 8px 10px;
      background: #0f1117; border: 1px solid #2d3152; border-radius: 6px;
      color: #e2e8f0; font-size: 13px; outline: none;
    }
    input:focus { border-color: #7c3aed; }
    button {
      cursor: pointer; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500; padding: 8px 14px;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-secondary { background: #1e293b; color: #94a3b8; border: 1px solid #2d3152; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    /* inbox */
    .inbox-list { flex: 1; overflow-y: auto; }
    .inbox-item {
      padding: 12px 16px; border-bottom: 1px solid #1e2235;
      cursor: pointer; transition: background .1s;
    }
    .inbox-item:hover, .inbox-item.active { background: #1e2235; }
    .inbox-item .name { font-size: 14px; font-weight: 500; }
    .inbox-item .preview { font-size: 12px; color: #64748b; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Chat pane ── */
    .chat-pane {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header {
      padding: 14px 20px; background: #1a1d2e;
      border-bottom: 1px solid #2d3152;
      font-size: 15px; font-weight: 500;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg {
      max-width: 72%; padding: 9px 13px; border-radius: 14px;
      font-size: 14px; line-height: 1.45; word-break: break-word;
    }
    .msg.mine { align-self: flex-end; background: #7c3aed; color: #fff; border-bottom-right-radius: 4px; }
    .msg.theirs { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; }
    .msg .meta { font-size: 10px; opacity: .6; margin-top: 4px; }

    .input-row {
      display: flex; gap: 8px; padding: 14px 16px;
      background: #1a1d2e; border-top: 1px solid #2d3152;
    }
    .input-row input {
      flex: 1; padding: 10px 14px; border-radius: 24px;
      background: #0f1117; border: 1px solid #2d3152;
      color: #e2e8f0; font-size: 14px; outline: none;
    }
    .input-row input:focus { border-color: #7c3aed; }
    .input-row button { border-radius: 24px; padding: 10px 20px; }

    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #1e293b; border: 1px solid #2d3152;
      color: #e2e8f0; padding: 10px 16px; border-radius: 8px;
      font-size: 13px; z-index: 999; display: none;
    }
    .toast.err { border-color: #991b1b; color: #fca5a5; background: #1c0a0a; }
    .empty { text-align: center; color: #334155; padding: 40px 0; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <span id="status-label">Disconnected</span>
  <h1 style="margin-left:auto">Chat Tester</h1>
</header>

<div class="main">

  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Login -->
    <div class="sidebar-section" id="login-section">
      <h2>Login</h2>
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" />
      <div class="btn-row">
        <button class="btn-primary" onclick="login()">Login &amp; Connect</button>
      </div>
      <div style="margin-top:10px;font-size:12px;color:#475569">
        Base URL: <input id="base-url" type="text" value="http://localhost:3000" style="margin-top:4px" />
      </div>
    </div>

    <!-- Connected info -->
    <div class="sidebar-section" id="connected-section" style="display:none">
      <h2>Connected as</h2>
      <div id="me-info" style="font-size:13px;color:#94a3b8;word-break:break-all"></div>
      <div class="btn-row">
        <button class="btn-danger" onclick="disconnect()">Disconnect</button>
      </div>
    </div>

    <!-- New chat -->
    <div class="sidebar-section" id="new-chat-section" style="display:none">
      <h2>New conversation</h2>
      <label>Other user UUID</label>
      <input id="other-uuid" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
      <div class="btn-row">
        <button class="btn-secondary" onclick="openConversation()">Open</button>
        <button class="btn-secondary" onclick="loadInbox()">Refresh inbox</button>
      </div>
    </div>

    <!-- Inbox -->
    <div class="inbox-list" id="inbox-list">
      <div class="empty">Login to see conversations</div>
    </div>
  </aside>

  <!-- Chat pane -->
  <section class="chat-pane">
    <div class="chat-header" id="chat-header">Select a conversation</div>
    <div class="messages" id="messages">
      <div class="empty">No messages yet</div>
    </div>
    <div class="input-row">
      <input id="msg-input" type="text" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendMessage()" disabled />
      <button class="btn-primary" onclick="sendMessage()" id="send-btn" disabled>Send</button>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
  let socket = null;
  let token = null;
  let myId = null;
  let activeConvId = null;
  let activeReceiverId = null;

  function baseUrl() {
    return document.getElementById('base-url').value.replace(/\/$/, '');
  }

  function toast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (isErr ? ' err' : '');
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value;
    if (!email || !pass) return toast('Enter email and password', true);

    try {
      const res = await fetch(`${baseUrl()}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login failed');

      token = data.session.access_token;
      myId = data.user.id;

      document.getElementById('me-info').textContent =
        `${data.user.name} (${myId})`;

      connectSocket();
    } catch (e) {
      toast(e.message, true);
    }
  }

  function connectSocket() {
    if (socket) socket.disconnect();

    socket = io(baseUrl(), {
      auth: { token },
      transports: ['websocket'],
    });

    socket.on('connect', () => {
      setConnected(true);
      toast('Connected');
      loadInbox();
    });

    socket.on('disconnect', () => {
      setConnected(false);
    });

    socket.on('error', (err) => {
      toast(err.message || 'Socket error', true);
    });

    socket.on('new_message', (msg) => {
      toast(`New message from ${msg.senderId === myId ? 'you' : msg.senderId}`);
      appendMessage(msg);

      // Refresh inbox to update previews
      loadInbox();
    });
  }

  function setConnected(yes) {
    document.getElementById('status-dot').className = yes ? 'connected' : '';
    document.getElementById('status-label').textContent = yes ? 'Connected' : 'Disconnected';
    document.getElementById('login-section').style.display = yes ? 'none' : '';
    document.getElementById('connected-section').style.display = yes ? '' : 'none';
    document.getElementById('new-chat-section').style.display = yes ? '' : 'none';
    document.getElementById('msg-input').disabled = !yes;
    document.getElementById('send-btn').disabled = !yes;
  }

  function disconnect() {
    if (socket) socket.disconnect();
    token = null; myId = null; activeConvId = null; activeReceiverId = null;
    document.getElementById('inbox-list').innerHTML = '<div class="empty">Login to see conversations</div>';
    document.getElementById('messages').innerHTML = '<div class="empty">No messages yet</div>';
    document.getElementById('chat-header').textContent = 'Select a conversation';
    setConnected(false);
  }

  async function loadInbox() {
    if (!token) return;
    try {
      const res = await fetch(`${baseUrl()}/chat/conversations?limit=50`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to load inbox');
      renderInbox(data.data);
    } catch (e) {
      toast(e.message, true);
    }
  }

  function renderInbox(conversations) {
    const el = document.getElementById('inbox-list');
    if (!conversations.length) {
      el.innerHTML = '<div class="empty">No conversations yet</div>';
      return;
    }
    el.innerHTML = conversations.map(c => `
      <div class="inbox-item ${c.id === activeConvId ? 'active' : ''}"
           onclick="selectConversation('${c.id}','${c.otherUser.id}','${escHtml(c.otherUser.name)}')">
        <div class="name">${escHtml(c.otherUser.name)}</div>
        <div class="preview">${c.lastMessage ? escHtml(c.lastMessage.content) : 'No messages yet'}</div>
      </div>
    `).join('');
  }

  async function openConversation() {
    const otherId = document.getElementById('other-uuid').value.trim();
    if (!otherId) return toast('Enter a user UUID', true);
    try {
      const res = await fetch(`${baseUrl()}/chat/conversations`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ otherUserId: otherId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed');
      loadInbox();
      // Try to get their name from the response
      const p1 = data.participant1Id;
      const otherName = p1 === myId ? 'User' : 'User';
      selectConversation(data.id, otherId, otherId.slice(0, 8) + '…');
    } catch (e) {
      toast(e.message, true);
    }
  }

  async function selectConversation(convId, otherId, otherName) {
    activeConvId = convId;
    activeReceiverId = otherId;
    document.getElementById('chat-header').textContent = `Chat with ${otherName}`;
    document.querySelectorAll('.inbox-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.inbox-item').forEach(el => {
      if (el.onclick?.toString().includes(convId)) el.classList.add('active');
    });
    await loadMessages(convId);
  }

  async function loadMessages(convId) {
    try {
      const res = await fetch(`${baseUrl()}/chat/conversations/${convId}/messages?limit=50`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to load messages');
      renderMessages(data.data.slice().reverse()); // API returns newest-first; show oldest first
    } catch (e) {
      toast(e.message, true);
    }
  }

  function renderMessages(messages) {
    const el = document.getElementById('messages');
    if (!messages.length) {
      el.innerHTML = '<div class="empty">No messages yet. Say hi!</div>';
      return;
    }
    el.innerHTML = messages.map(m => `
      <div class="msg ${m.senderId === myId ? 'mine' : 'theirs'}">
        ${escHtml(m.content)}
        <div class="meta">${new Date(m.createdAt).toLocaleTimeString()}</div>
      </div>
    `).join('');
    el.scrollTop = el.scrollHeight;
  }

  function appendMessage(msg) {
    if (msg.conversationId !== activeConvId) return;
    const el = document.getElementById('messages');
    const empty = el.querySelector('.empty');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = 'msg ' + (msg.senderId === myId ? 'mine' : 'theirs');
    div.innerHTML = `${escHtml(msg.content)}<div class="meta">${new Date(msg.createdAt).toLocaleTimeString()}</div>`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const content = input.value.trim();
    if (!content) return;
    if (!activeReceiverId) return toast('Open a conversation first', true);
    if (!socket?.connected) return toast('Not connected', true);

    socket.emit('send_message', { receiverId: activeReceiverId, content });
    input.value = '';
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
