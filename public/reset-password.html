<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9a7a;
      --accent-hover: #4bb08c;
      --danger: #d96b6b;
      --border: #2a3542;
      --input: #121820;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at top, #1a2a28 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p.lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 1rem;
    }

    input:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      border-color: var(--accent);
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #062218;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: rgba(217, 107, 107, 0.12);
      color: #f0b4b4;
      border: 1px solid rgba(217, 107, 107, 0.35);
    }

    .status.success {
      background: rgba(61, 154, 122, 0.12);
      color: #9fd9c2;
      border: 1px solid rgba(61, 154, 122, 0.35);
    }

    .token-hint {
      margin-bottom: 20px;
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }

    .token-hint strong {
      color: var(--text);
    }
  </style>
</head>

<body>
  <main>
    <h1>Reset password</h1>
    <p class="lead">
      Enter a new password for your account. This page reads the reset token
      from the link in your email.
    </p>

    <!-- <div id="tokenHint" class="token-hint" hidden></div> -->

    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72"
        required placeholder="At least 8 characters" />

      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72"
        required placeholder="Repeat password" />

      <button type="submit" id="submitBtn">Update password</button>
    </form>

    <div id="status" class="status" role="status"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const form = document.getElementById("resetForm");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    // const tokenHint = document.getElementById("tokenHint");

    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status show " + type;
    }

    if (!token) {
      showStatus(
        "Missing reset token. Open the full link from your email (or the server log after forgot-password).",
        "error",
      );
      form.querySelectorAll("input, button").forEach((el) => {
        el.disabled = true;
      });
    } 

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!token) return;

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        showStatus("Passwords do not match.", "error");
        return;
      }

      submitBtn.disabled = true;
      showStatus("Updating password…", "success");

      try {
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const message =
            data.message ||
            (Array.isArray(data.message)
              ? data.message.join(", ")
              : "Reset failed");
          throw new Error(
            typeof message === "string" ? message : "Reset failed",
          );
        }

        showStatus(
          data.message || "Password updated successfully. You can log in now.",
          "success",
        );
        form.reset();
      } catch (err) {
        showStatus(err.message || "Something went wrong.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
